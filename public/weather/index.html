<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weather Board</title>
<meta name="description" content="Full-screen weather for exactly where you are: now, the next hours, the week ahead, sun and moon, birthdays, and the next train.">
<link rel="manifest" href="/weather/manifest.webmanifest">
<meta name="theme-color" content="#0a0a0d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather">
<link rel="icon" href="/weather/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/weather/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,1,0&icon_names=air,bedtime,block,cake,calendar_month,chevron_right,close,cloud,compress,eco,humidity_percentage,landscape,light_mode,local_florist,location_city,thermostat,train,umbrella,visibility,wb_twilight&display=block">
<link rel="stylesheet" href="/weather/weather.css">
</head>
<body>
<main class="grid">
  <header class="top">
    <div class="timebox">
      <div class="clock" id="clock">--:--</div>
      <div class="date"><span id="date"></span> · <button class="place" id="place" title="Update location">Locating…</button></div>
    </div>
  </header>
  <button class="now" id="nowBtn" title="Today hour by hour">
    <span class="nowicon" id="nowIcon"></span>
    <span class="nowtemp" id="nowTemp">--°</span>
    <span class="nowtext">
      <b id="nowCond">—</b>
      <span id="nowFeels"></span>
      <span class="hilo"><span class="hi" id="nowHi"></span><span class="lo" id="nowLo"></span></span>
    </span>
  </button>

  <section class="card hourly">
    <div id="rainBlock" hidden>
      <div class="cardhead">
        <h2>Rain · next 3 hours<span class="sub" id="rainSub"></span></h2>
      </div>
      <div class="nowcast" id="nowcast"></div>
    </div>
    <div class="cardhead">
      <h2>Next 24 hours<span class="sub" id="dryNote"></span></h2>
      <span class="stamp" id="stamp"></span>
      <button class="more" id="moreBtn">More<span class="ms">chevron_right</span></button>
    </div>
    <div class="chart" id="hourChart"></div>
    <div class="hourdetail" id="hourDetail"></div>
  </section>

  <section class="card bdays" id="bdCard" role="button" tabindex="0" title="All birthdays">
    <div class="cardhead">
      <h2><span class="ms ic-sun">cake</span><span id="bdTitle">Birthdays</span></h2>
      <span class="more">All<span class="ms">chevron_right</span></span>
    </div>
    <div class="bdbody" id="bdBody"><div class="empty">Loading…</div></div>
  </section>

  <section class="card days">
    <div class="cardhead"><h2 id="daysTitle">Next 10 days</h2>
      <div class="seg" id="daySeg"><button data-k="temp" class="on">Temp</button><button data-k="rain">Rain</button></div>
      <button class="more" id="daysMore">10 days<span class="ms">chevron_right</span></button></div>
    <div class="daylist" id="days"></div>
  </section>

  <section class="summary" id="summary"></section>

  <section class="card deps">
    <div class="cardhead">
      <button class="station" id="station" title="Change station">—</button>
      <div class="dirtog" id="dirTog"></div>
    </div>
    <div class="dirname"><span id="dirName"></span><span class="stamp" id="depStamp"></span></div>
    <div class="deplist" id="deps"><div class="empty">Loading…</div></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <button class="close" id="modalClose" title="Close"><span class="ms">close</span></button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"
        integrity="sha512-F6rjAEKNMtM0aODcc/MdnAvhGxn7FCbAkKJ5FKba/fnD3gnN+LBEok326WAMdOhKQKYNr+j/tJEuV1PKwIfhCA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/weather/weather.js"></script>
</body>
</html>
