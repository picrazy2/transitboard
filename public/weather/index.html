<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weather Board</title>
<meta name="description" content="Full-screen weather for exactly where you are: now, next hours, rain radar, the week ahead, and the next train.">
<link rel="manifest" href="/weather/manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather">
<link rel="icon" href="/weather/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/weather/icon-512.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,1,0&icon_names=air,bedtime,block,calendar_month,chevron_right,clear_night,close,cloud,compress,eco,foggy,humidity_percentage,light_mode,local_florist,open_in_full,partly_cloudy_day,partly_cloudy_night,rainy,rainy_heavy,rainy_light,sunny,thermostat,thunderstorm,train,umbrella,visibility,wb_twilight,weather_mix,weather_snowy,zoom_out_map&display=block">
<link rel="stylesheet" href="/weather/weather.css">
<script>
// Pick the theme before first paint (weather.js refines it from the sun once data lands).
(function(){try{var q=new URLSearchParams(location.search).get("theme"),h=new Date().getHours();
document.documentElement.dataset.theme=q||((h<7||h>=19)?"dark":"light");}catch(e){}})();
</script>
</head>
<body>
<main class="grid">
  <header class="top">
    <div class="timebox">
      <div class="clock" id="clock">--:--</div>
      <div class="date"><span id="date"></span> · <button class="place" id="place" title="Update location">Locating…</button></div>
    </div>
    <button class="now" id="nowBtn" title="Details for now">
      <span class="nowicon" id="nowIcon"></span>
      <span class="nowtemp" id="nowTemp">--°</span>
      <span class="nowtext">
        <b id="nowCond">—</b>
        <span id="nowFeels"></span>
        <span class="hilo"><span class="hi" id="nowHi"></span><span class="lo" id="nowLo"></span></span>
      </span>
    </button>
  </header>
  <section class="summary" id="summary"></section>

  <section class="card hourly">
    <div id="rainBlock" hidden>
      <div class="cardhead">
        <h2>Rain · next 3 hours<span class="sub" id="rainSub"></span></h2>
      </div>
      <div class="nowcast" id="nowcast"></div>
    </div>
    <div class="cardhead">
      <h2>Next 24 hours<span class="sub" id="dryNote"></span></h2>
      <span class="stamp" id="stamp"></span>
      <div class="seg" id="hourSeg">
        <button data-k="temp" class="on">Temp</button><button data-k="rain">Rain</button><button data-k="wind">Wind</button>
      </div>
    </div>
    <div class="chart" id="hourChart"></div>
    <div class="hourdetail" id="hourDetail"></div>
  </section>

  <section class="card radar" id="radarCard">
    <div id="map"></div>
    <div class="mapstatus" id="radarStatus" hidden></div>
    <div class="radarbar">
      <span class="rtime" id="radarTime">Radar</span>
      <input type="range" class="rslider" id="radarSlider" min="0" max="0" step="1" aria-label="Radar time">
      <button id="radarCloud" class="cloudtog" title="Cloud cover"><span class="ms">cloud</span></button>
      <button id="radarBig" title="Expand map"><span class="ms">open_in_full</span></button>
    </div>
  </section>

  <section class="card days">
    <div class="cardhead"><h2 id="daysTitle">Next 10 days</h2>
      <div class="seg" id="daySeg"><button data-k="temp" class="on">Temp</button><button data-k="rain">Rain</button></div>
      <button class="more" id="daysMore">10 days<span class="ms">chevron_right</span></button></div>
    <div class="daylist" id="days"></div>
  </section>

  <section class="card tiles" id="tiles"></section>

  <section class="card deps">
    <div class="cardhead">
      <button class="station" id="station" title="Change station">—</button>
      <span class="stamp" id="depStamp"></span>
    </div>
    <div class="dirtog" id="dirTog"></div>
    <div class="deplist" id="deps"><div class="empty">Loading…</div></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <button class="close" id="modalClose" title="Close"><span class="ms">close</span></button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/weather/weather.js"></script>
</body>
</html>
